; LoRa Scope ADV
; Target: M5Stack Cardputer ADV + Cap LoRa-1262/SX1262
; Framework: Arduino / PlatformIO

[platformio]
default_envs = cardputer_adv
src_dir = src
include_dir = include

[env:cardputer_adv]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Cardputer ADV / StampS3-style ESP32-S3 settings.
; If your PlatformIO has a dedicated M5Stack Cardputer board, you can switch board=... later.
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DLORA_SCOPE_VERSION=\"0.1.0-mvp\"

lib_deps =
  m5stack/M5Cardputer
  jgromes/RadioLib
